[platformio]
default_envs = bai3_scd30

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.usbserial-130
monitor_port = /dev/cu.usbserial-130
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    sparkfun/SparkFun SCD30 Arduino Library @ ^1.0.20
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000

[env:bai2_blink]
build_src_filter = -<*> +<bai2_blink.cpp>

[env:bai3_scd30]
build_src_filter = -<*> +<bai3_scd30.cpp>

[env:bai4_semaphore]
build_src_filter = -<*> +<bai4_semaphore.cpp>

[env:bai5_webserver]
build_src_filter = -<*> +<bai5_webserver.cpp>
